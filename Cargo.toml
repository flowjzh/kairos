[workspace]
resolver = "2"
members = ["libs/codec", "libs/client", "libs/report", "libs/statusline", "ffi", "cli", "plugins/claude-code"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
# Size-focused: nothing here is a hot loop (the report reducer is one-pass O(n)
# and memoized), so the default opt-level 3 (speed) just bloats the binaries.
opt-level = 's'
strip = true
lto = true
codegen-units = 1

# The Claude Code hook (`kairos-claude-code`) has no terminal/PTY state to unwind
# on panic, so it aborts instead — a smaller binary. `panic` can't be a per-package
# override, hence its own profile: `make plugin` builds the hook here, while the CLI
# keeps unwinding so a panic can restore the terminal out of raw mode.
[profile.hook]
inherits = "release"
panic = "abort"
