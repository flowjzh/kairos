[project]
name = 'kairos-sdk'
version = '0.1.0'
description = 'Python SDK for the Kairos human-time daemon (line-JSON socket client).'
requires-python = '>=3.11'
dependencies = []

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src/kairos_sdk']

[dependency-groups]
dev = ['pytest>=8']

[tool.pytest.ini_options]
testpaths = ['tests']
