[package]
name = "kairos-pty"
version = "0.1.0"
edition = "2021"
description = "Transparent PTY wrapper that reports terminal focus to the Kairos daemon"

[[bin]]
name = "kairos-pty"
path = "src/main.rs"

[dependencies]
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
signal-hook = "0.3"
crossterm = "0.28"
