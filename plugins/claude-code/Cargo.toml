[package]
name = "kairos-claude-code"
version.workspace = true
edition.workspace = true
description = "Claude Code hook → Kairos RPC mapping (agent-specific; the daemon stays agent-agnostic)"

[[bin]]
name = "kairos-claude-code"
path = "src/main.rs"

[dependencies]
kairos-codec = { path = "../../libs/codec" }
kairos-client = { path = "../../libs/client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
