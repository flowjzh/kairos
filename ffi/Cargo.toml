[package]
name = "kairos-ffi"
version.workspace = true
edition.workspace = true
description = "General C-ABI bridge: the one staticlib boundary between a native host (Swift/…) and Kairos Rust modules"

[lib]
name = "kairos_ffi"
crate-type = ["staticlib", "rlib"]

[dependencies]
kairos-report = { path = "../libs/report" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
